name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra qt --extra pygame --extra lowlatency

      - name: Pytest
        run: uv run python -m pytest -v
        env:
          # Headless pygame for extrapolation interactive tests
          SDL_VIDEODRIVER: dummy
          THE_KIT_EXTRAPOLATION_AUTO_INPUT: "1"
          THE_KIT_EXTRAPOLATION_SMOKE: "1"
