[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "the-kit"
version = "0.5.0a0"
description = "Orchestrateur de manipulations psychophysiques (Qt, Pygame, PsychoPy)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Maxime Rosito" }]
dependencies = []

[project.optional-dependencies]
qt = ["PyQt6>=6.5", "pyserial>=3.5"]
pygame = ["pygame>=2.6"]
# psychopy : installer manuellement (conflits résolution uv / pypi-search)
# uv pip install 'psychopy==2023.2.3' moviepy
lowlatency = ["sounddevice>=0.4.6", "soundfile>=0.12"]
ni = ["nidaqmx>=1.4.0"]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[dependency-groups]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[tool.uv]
default-groups = ["dev"]
# macOS + Windows labo + Linux CI
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

[project.scripts]
the_kit = "the_kit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["the_kit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
